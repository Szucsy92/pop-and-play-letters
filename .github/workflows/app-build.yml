name: Gyerek billentyűzet – APK és IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-release
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-latest
    outputs:
      stamp: ${{ steps.s.outputs.stamp }}
      version: ${{ steps.s.outputs.version }}
      code: ${{ steps.s.outputs.code }}
    steps:
      - id: s
        run: |
          echo "stamp=$(TZ=Europe/Budapest date +%Y-%m-%d_%H%M)" >> "$GITHUB_OUTPUT"
          echo "version=$(TZ=Europe/Budapest date +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
  android:
    needs: stamp
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: ${{ needs.stamp.outputs.version }}
      APP_VERSION_CODE: ${{ needs.stamp.outputs.code }}
      BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: bun install --frozen-lockfile
      - name: Offline játék csomagolása
        env:
          VITE_APP_VERSION: ${{ needs.stamp.outputs.version }}
          VITE_APP_VERSION_CODE: ${{ needs.stamp.outputs.code }}
          VITE_RELEASE_REPOSITORY: ${{ github.repository }}
        run: bun run build:app
      - name: Android előkészítése
        run: |
          bunx cap add android
          bunx cap sync android
          node scripts/patch-native.mjs android
      - name: APK aláírása az állandó kulccsal
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KS_PASSWORD" ] || [ -z "$KS_BASE64" ]; then
            echo "::error::Állítsd be az ANDROID_KEYSTORE_PASSWORD és ANDROID_KEYSTORE_BASE64 GitHub-titkokat."
            exit 1
          fi
          KS_FILE="$RUNNER_TEMP/playful-keypad.keystore"
          printf '%s' "$KS_BASE64" | base64 -d > "$KS_FILE"
          chmod 600 "$KS_FILE"
          echo "KS_FILE=$KS_FILE" >> "$GITHUB_ENV"
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KS_FILE" \
            -Pandroid.injected.signing.store.password="$KS_PASSWORD" \
            -Pandroid.injected.signing.key.alias=playfulkeypad \
            -Pandroid.injected.signing.key.password="$KS_PASSWORD")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/playful-keypad-${BUILD_STAMP}.apk"
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose out/*.apk
          "$APKSIGNER" verify --print-certs out/*.apk > "$RUNNER_TEMP/apk-certs.txt"
          ACTUAL=$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certs.txt" | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(keytool -exportcert -keystore "$KS_FILE" -storepass:env KS_PASSWORD -alias playfulkeypad | sha256sum | cut -d ' ' -f1)
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Kulcs törlése a futtatóról
        if: always()
        run: rm -f "$RUNNER_TEMP/playful-keypad.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error
  ios:
    needs: stamp
    runs-on: macos-26
    env:
      APP_VERSION_NAME: ${{ needs.stamp.outputs.version }}
      APP_VERSION_CODE: ${{ needs.stamp.outputs.code }}
      BUILD_STAMP: ${{ needs.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Offline játék csomagolása
        env:
          VITE_APP_VERSION: ${{ needs.stamp.outputs.version }}
          VITE_APP_VERSION_CODE: ${{ needs.stamp.outputs.code }}
          VITE_RELEASE_REPOSITORY: ${{ github.repository }}
        run: bun run build:app
      - name: iOS előkészítése
        run: |
          xcodebuild -version
          bunx cap add ios --packagemanager CocoaPods
          bunx cap sync ios
          node scripts/patch-native.mjs ios
      - name: Aláíratlan IPA készítése
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > "$RUNNER_TEMP/xcode.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/xcode.log"; exit 1; }
          APP=$(ls -d "$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos/"*.app | head -n1)
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" out
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/playful-keypad-${BUILD_STAMP}.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: out/*.ipa
          if-no-files-found: error
  release:
    needs: [stamp, android, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Frissítési adatok
        env:
          REPO: ${{ github.repository }}
          CODE: ${{ needs.stamp.outputs.code }}
          VERSION: ${{ needs.stamp.outputs.version }}
          STAMP: ${{ needs.stamp.outputs.stamp }}
        run: |
          test -f "out/playful-keypad-${STAMP}.apk"
          python3 - <<'PY'
          import json, os
          tag = f"build-{os.environ['STAMP']}-{os.environ['CODE']}"
          url = f"https://github.com/{os.environ['REPO']}/releases/download/{tag}/playful-keypad-{os.environ['STAMP']}.apk"
          with open('out/playful-keypad-release.json', 'w') as f:
              json.dump({'versionCode': int(os.environ['CODE']), 'version': os.environ['VERSION'], 'apkUrl': url}, f)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ needs.stamp.outputs.stamp }}-${{ needs.stamp.outputs.code }}
          name: Gyerek billentyűzet ${{ needs.stamp.outputs.version }}
          make_latest: true
          body: |
            Offline játék · Verzió ${{ needs.stamp.outputs.version }} (#${{ needs.stamp.outputs.code }})
            Android: állandó kulccsal aláírt APK. Frissítés a szülői menüből, letöltés és a telefon telepítési jóváhagyása után.
            iPhone: aláíratlan IPA, AltStore/Sideloadly segítségével telepítéskor aláírandó. Az Android-kulcs 100 éves érvényessége az iPhone-ra nem vonatkozik.
          files: out/*
