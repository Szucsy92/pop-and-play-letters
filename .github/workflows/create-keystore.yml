name: Aláírókulcs készítése (egyszeri)

# A kulcs és a jelszó SOHA nem kerül a naplóba vagy nyílt artifactba:
# - a GitHub-titkokat közvetlenül beállítja (ehhez KEYSTORE_ADMIN_TOKEN kell),
# - a biztonsági mentés csak jelszóval titkosítva (KEYSTORE_BACKUP_PASSPHRASE) tölthető le.
#
# Előkészítés (egyszer, Settings → Secrets and variables → Actions):
#   KEYSTORE_ADMIN_TOKEN        fine-grained token, csak erre a tárolóra, jogosultság: "Secrets: Read and write"
#   KEYSTORE_BACKUP_PASSPHRASE  általad választott hosszú jelszó a mentés titkosításához

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Meglévő kulcs felülírása (a már telepített app nem frissíthető az újjal!)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.KEYSTORE_ADMIN_TOKEN }}
      BACKUP_PASS: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
      EXISTING: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ALIAS: playfulkeypad
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ellenőrzések
        run: |
          set -euo pipefail
          MISSING=0
          if [ -z "$GH_TOKEN" ]; then echo "::error::A KEYSTORE_ADMIN_TOKEN nem érhető el. Repository secret legyen (nem Environment/Dependabot/Variables), pontos névvel, nem üres értékkel."; MISSING=1; else echo "KEYSTORE_ADMIN_TOKEN: megvan (${#GH_TOKEN} karakter)"; fi
          if [ "${#BACKUP_PASS}" -lt 12 ]; then echo "::error::A KEYSTORE_BACKUP_PASSPHRASE nem érhető el, vagy rövidebb 12 karakternél (jelenleg ${#BACKUP_PASS})."; MISSING=1; else echo "KEYSTORE_BACKUP_PASSPHRASE: megvan (${#BACKUP_PASS} karakter)"; fi
          [ "$MISSING" = "0" ] || exit 1
          if [ -n "$EXISTING" ] && [ "${{ inputs.overwrite }}" != "true" ]; then
            echo "::error::Már van ANDROID_KEYSTORE_BASE64 titok. Nem írom felül. Ha tényleg újat akarsz, jelöld be az 'overwrite' opciót."
            exit 1
          fi

      - name: Kulcs generálása és titkok beállítása
        run: |
          set -euo pipefail
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair -storetype PKCS12 -keystore playful-keypad.keystore -alias "$ALIAS" \
            -storepass "$PASS" -keypass "$PASS" -keyalg RSA -keysize 4096 -validity 36525 \
            -dname "CN=Gyerek billentyuzet"
          printf '%s' "$PASS" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
          base64 -w0 playful-keypad.keystore | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$ALIAS" | gh secret set ANDROID_KEY_ALIAS --repo "$GITHUB_REPOSITORY"
          echo "Ujjlenyomat (SHA-256, nyilvános adat):"
          keytool -list -keystore playful-keypad.keystore -storepass "$PASS" -alias "$ALIAS" | tail -n 1
          # titkosított mentés: kulcstár + jelszó
          mkdir backup
          cp playful-keypad.keystore backup/
          printf '%s' "$PASS" > backup/password.txt
          tar -czf backup.tgz -C backup .
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASS -in backup.tgz -out keystore-backup.enc
          rm -rf backup backup.tgz playful-keypad.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-encrypted
          path: keystore-backup.enc
          retention-days: 7
          if-no-files-found: error

# Mentés visszafejtése (saját gépen):
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in keystore-backup.enc -out backup.tgz   (jelszót kér)
#   tar -xzf backup.tgz
